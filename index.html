
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>منصة مستشفى الدقم</title>
    <style>
        body {
            font-family: Tahoma, Arial;
            background: #eef4fa;
            text-align: center;
            padding: 50px 20px;
        }
        h1 { color:#0ca80e }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 4px 15px #0001;
        }

        
.navbar {
    background: #165b93;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    border-radius: 12px;
    margin-bottom: 30px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.nav-links {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.nav-links a {
    color: white;
    text-decoration: none;
    font-size: 16px;
}

.nav-links a:hover {
    color: #b9e3ff;
}

        
.section {
    background: white;
    padding: 30px;
    margin: 20px auto;
    max-width: 800px;
    border-radius: 12px;
    box-shadow: 0 4px 12px #0001;
}

.section h2 {
    color: #165b93;
}

html {
    scroll-behavior: smooth;
}

        
.about-image {
    width: 100%;
    max-width: 450px;
    height: auto;
    border-radius: 15px;
    margin-top: 20px;
    box-shadow: 0 5px 15px #0002;
}


    </style>
</head>
<body>
    
<nav class="navbar">
    <div class="logo">منصة مستشفى الدقم</div>

    <div class="nav-links">
        <a href="#home">الرئيسية</a>
        <a href="#about">من نحن</a>
        <a href="#services">الخدمات</a>
        <a href="#contact">اتصل بنا</a>
    </div>
</nav>

<section id="home" class="section">
    <h2>الرئيسية</h2>
    <p>مرحباً بكم في موقعي الإلكتروني.</p>
</section>

<section id="about" class="section">
    <h2>من نحن</h2>
    <p>
        هذا موقع تجريبي لتعلم تصميم
        وتطوير صفحات الويب.
    </p>
    
<img src="photo.jpg"
     alt="صورة موقعي"
     class="about-image">

</section>

<section id="services" class="section">
    <h2>الخدمات</h2>
    <p>
        نقدم محتوى تعليميًا في مجال
        التقنية والبرمجة.
    </p>
</section>

<section id="contact" class="section">
    <h2>اتصل بنا</h2>
    <p>مرحباً باستفساراتكم ومقترحاتكم.</p>
</section>
